<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #2b6cb0; stroke-width: 2; }
    .title { fill: #2b6cb0; font-weight: bold; font-size: 14px; }
    .field { fill: #1a202c; font-size: 11px; }
    .rel { stroke: #718096; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#718096"/>
    </marker>
  </defs>

  <!-- teams -->
  <rect class="box" x="40" y="40" width="180" height="110" rx="6"/>
  <text class="title" x="55" y="60">teams</text>
  <text class="field" x="55" y="80">id PK</text>
  <text class="field" x="55" y="96">name</text>
  <text class="field" x="55" y="112">description</text>

  <!-- users -->
  <rect class="box" x="320" y="20" width="200" height="160" rx="6"/>
  <text class="title" x="335" y="40">users</text>
  <text class="field" x="335" y="60">id PK</text>
  <text class="field" x="335" y="76">email</text>
  <text class="field" x="335" y="92">password_hash</text>
  <text class="field" x="335" y="108">name</text>
  <text class="field" x="335" y="124">role</text>
  <text class="field" x="335" y="140">team_id FK</text>

  <!-- events -->
  <rect class="box" x="620" y="20" width="220" height="170" rx="6"/>
  <text class="title" x="635" y="40">events</text>
  <text class="field" x="635" y="60">id PK</text>
  <text class="field" x="635" y="76">team_id FK</text>
  <text class="field" x="635" y="92">title / description</text>
  <text class="field" x="635" y="108">start_time / end_time</text>
  <text class="field" x="635" y="124">location / type</text>
  <text class="field" x="635" y="140">created_by FK</text>

  <!-- attendance -->
  <rect class="box" x="900" y="60" width="200" height="110" rx="6"/>
  <text class="title" x="915" y="80">attendance</text>
  <text class="field" x="915" y="100">id PK</text>
  <text class="field" x="915" y="116">event_id FK</text>
  <text class="field" x="915" y="132">user_id FK / status</text>

  <!-- posts -->
  <rect class="box" x="320" y="260" width="200" height="130" rx="6"/>
  <text class="title" x="335" y="280">posts</text>
  <text class="field" x="335" y="300">id PK</text>
  <text class="field" x="335" y="316">team_id FK</text>
  <text class="field" x="335" y="332">author_id FK</text>
  <text class="field" x="335" y="348">content / media_url</text>

  <!-- achievements -->
  <rect class="box" x="40" y="260" width="200" height="110" rx="6"/>
  <text class="title" x="55" y="280">achievements</text>
  <text class="field" x="55" y="300">id PK</text>
  <text class="field" x="55" y="316">user_id FK</text>
  <text class="field" x="55" y="332">type / points</text>

  <!-- device_tokens -->
  <rect class="box" x="620" y="260" width="200" height="110" rx="6"/>
  <text class="title" x="635" y="280">device_tokens</text>
  <text class="field" x="635" y="300">id PK</text>
  <text class="field" x="635" y="316">user_id FK</text>
  <text class="field" x="635" y="332">token / platform</text>

  <!-- chat_messages -->
  <rect class="box" x="900" y="260" width="200" height="110" rx="6"/>
  <text class="title" x="915" y="280">chat_messages</text>
  <text class="field" x="915" y="300">id PK</text>
  <text class="field" x="915" y="316">team_id FK / sender_id FK</text>
  <text class="field" x="915" y="332">content / sent_at</text>

  <!-- relations -->
  <path class="rel" d="M220,90 L320,90"/>
  <path class="rel" d="M520,60 L620,60"/>
  <path class="rel" d="M840,70 L900,90"/>
  <path class="rel" d="M420,180 L420,260"/>
  <path class="rel" d="M340,180 L140,260"/>
  <path class="rel" d="M240,320 L320,320" marker-end="url(#arrow)"/>
  <path class="rel" d="M520,300 L620,300"/>
  <path class="rel" d="M840,300 L900,300"/>
</svg>
